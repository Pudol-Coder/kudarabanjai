<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한자 게임 테스트 빌드</title>
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --c{syntax:"<number>";initial-value:0;inherits:true}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:#1d2440;font-family:"Noto Sans KR",system-ui,sans-serif;background:linear-gradient(#cfe6ff,#f6fbff 55%,#e6ecfa);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#scene{position:relative;max-width:760px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
#scene.shake{animation:shk .25s}
@keyframes shk{20%{transform:translate(-5px,3px)}50%{transform:translate(4px,-3px)}80%{transform:translate(-2px,2px)}}
#hud{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:14px}
#hud.damaged{animation:hudhit .35s}
@keyframes hudhit{30%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
#speechMode{display:flex;align-items:center;gap:5px;position:relative;z-index:10}
.modeBtn{border:1px solid #c9d3ee;background:#fff;color:#52607f;border-radius:10px;padding:5px 8px;font:700 11px/1 inherit;cursor:pointer;box-shadow:0 2px 0 #c9d3ee;transition:.18s}
.modeBtn:hover{border-color:#8ea8ff}
.modeBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #c9d3ee}
.modeBtn.active.tease{background:#fff4df;border-color:#f1bb6b;color:#7c4b08;box-shadow:0 0 10px #f2bd6a55,0 2px 0 #e0b06a}
.modeBtn.active.cheer{background:#eef5ff;border-color:#92abff;color:#3957a8;box-shadow:0 0 10px #92abff55,0 2px 0 #9db0ec}
#modeLabel{font-size:10px;opacity:.55;margin-right:2px}
@media(max-width:520px){#speechMode{gap:3px}.modeBtn{padding:5px 6px;font-size:10px}#modeLabel{display:none}}
#hpbar{width:150px;height:10px;background:#d3daf0;border-radius:6px;overflow:hidden;position:relative}
#hpbar.enemyHit{animation:hpimpact .45s}
@keyframes hpimpact{0%{transform:scale(1)}35%{transform:scale(1.18);filter:brightness(1.7)}100%{transform:scale(1)}}
#board.enemyHit{animation:boardimpact .5s}
@keyframes boardimpact{0%{transform:perspective(900px) rotateX(10deg) scale(1)}28%{transform:perspective(900px) rotateX(10deg) scale(1.035) translateX(-5px);filter:brightness(1.22) saturate(1.25)}55%{transform:perspective(900px) rotateX(10deg) scale(1.018) translateX(5px)}100%{transform:perspective(900px) rotateX(10deg) scale(1)}}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#ff5d6c,#ff9f4a);transition:width .3s}
#arena{position:relative;flex:1;min-height:260px}
#arena::before{content:"";position:absolute;left:50%;top:-40px;width:420px;height:420px;margin-left:-210px;background:radial-gradient(circle,#fff7dc,transparent 65%)}
#mob{position:absolute;top:22px;left:50%;width:104px;height:104px;margin-left:-52px;filter:drop-shadow(0 8px 12px #5a28a066);transition:transform .15s,opacity .4s}
#monsterHpWrap{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:130px;text-align:center;z-index:7;pointer-events:none}
#monsterHpBar{height:9px;border:2px solid #6d5a92;border-radius:999px;background:#ded8ec;overflow:hidden;box-shadow:0 2px 6px #3c508c33}
#monsterHpFill{height:100%;width:100%;background:linear-gradient(90deg,#8e5cff,#ff6bb8);transition:width .3s}
#monsterHpText{font-size:10px;font-weight:800;color:#47345f;margin-top:3px;text-shadow:0 1px #fff}
#mob.enter{animation:drop .9s cubic-bezier(.2,.8,.2,1)}
#mob.hit{filter:drop-shadow(0 0 16px #ff9d00) brightness(1.8);transform:translateY(8px)}
#mob.cast{filter:drop-shadow(0 0 24px #6d4cff) brightness(1.25);transform:scale(1.08)}
#mob.die{transform:scale(.1) rotate(90deg);opacity:0}
#monsterAura{position:absolute;inset:-12px;border-radius:40%;background:radial-gradient(circle,rgba(255,190,80,.30),rgba(145,95,255,.16) 48%,transparent 72%);filter:blur(7px);animation:auraPulse 1.8s ease-in-out infinite;pointer-events:none}
.horn{position:absolute;top:-5px;width:26px;height:36px;background:linear-gradient(180deg,#fff2b6,#ffb84a);clip-path:polygon(50% 0,100% 100%,50% 78%,0 100%);filter:drop-shadow(0 3px 4px #6d3b8a55);z-index:3}
.horn.left{left:12px;transform:rotate(-24deg)}.horn.right{right:12px;transform:rotate(24deg)}
#mobFace{position:absolute;inset:24px 16px 18px;z-index:4;pointer-events:none}
.eye{position:absolute;top:26px;width:22px;height:28px;border-radius:50%;background:#fff;border:3px solid #32134b;box-shadow:0 2px 6px #2c154055}
.eye::after{content:"";position:absolute;left:7px;top:7px;width:7px;height:11px;border-radius:50%;background:#2a1240}
.eye.left{left:13px}.eye.right{right:13px}
.mouth{position:absolute;left:50%;bottom:5px;width:34px;height:15px;transform:translateX(-50%);border-bottom:4px solid #2a1240;border-radius:0 0 50% 50%}
@keyframes auraPulse{50%{transform:scale(1.08);opacity:.72}}
#monsterSpeech{position:absolute;left:calc(100% - 8px);top:-8px;width:min(220px,42vw);padding:9px 12px;border:2px solid #c9d3ee;border-radius:15px;background:#fff;box-shadow:0 8px 22px #3c508c22;color:#2a2f4d;font-size:13px;font-weight:700;line-height:1.35;z-index:8;opacity:0;transform:translateY(4px) scale(.94);transform-origin:left bottom;pointer-events:none;transition:opacity .18s,transform .18s}
#monsterSpeech::before{content:"";position:absolute;left:-10px;bottom:12px;width:16px;height:16px;background:#fff;border-left:2px solid #c9d3ee;border-bottom:2px solid #c9d3ee;transform:rotate(45deg)}
#monsterSpeech.show{opacity:1;transform:translateY(0) scale(1)}
#monsterSpeech.good{border-color:#b8c7ff;background:#f4f6ff}
#monsterSpeech.bad{border-color:#ffd08a;background:#fff8ea}
@media(max-width:520px){#monsterSpeech{left:50%;top:108px;width:min(250px,78vw);transform-origin:center top}#monsterSpeech::before{left:50%;top:-9px;bottom:auto;transform:translateX(-50%) rotate(45deg);border-left:2px solid #c9d3ee;border-bottom:0;border-top:2px solid #c9d3ee;background:#fff}#monsterSpeech.show{transform:translateX(-50%) translateY(0) scale(1)}}
@keyframes drop{from{transform:translateY(-260px) scale(.5);opacity:0}50%{opacity:1}}
#mobBody{position:absolute;inset:0;background:linear-gradient(135deg,#7a3cff,#c2358f);clip-path:var(--cp);animation:spin 12s linear infinite}
#mobBody::after{content:"";position:absolute;inset:24%;background:#2a1240;clip-path:var(--cp)}
@keyframes spin{to{transform:rotate(360deg)}}
#tw{position:absolute;left:0;right:0;bottom:8px;text-align:center}
#target{font-size:90px;line-height:1.05;text-shadow:0 0 26px #ffb02099}
#hint{font-size:12px;opacity:.6}
#board{position:relative;margin:0 12px 16px;padding:12px 12px 14px;border-radius:18px;background:linear-gradient(#fff,#edf1fb);border:2px solid color-mix(in srgb,#ffb020 calc(var(--c)*100%),#c3cde8);box-shadow:0 10px 28px #3c508c26,0 0 calc(var(--c)*46px) rgba(255,160,0,calc(var(--c)*.7));transform:perspective(900px) rotateX(10deg);transform-origin:50% 100%;transition:--c .6s}
#board::before{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;background:radial-gradient(ellipse at 50% 0,rgba(255,176,32,calc(var(--c)*.45)),transparent 70%)}
#board.burst{animation:bst .6s}
@keyframes bst{40%{transform:perspective(900px) rotateX(10deg) scale(1.035);filter:brightness(1.1)}}
#boardInner{display:flex;gap:12px;align-items:stretch;position:relative;z-index:2;transition:gap .25s}
#boardInner.massive{gap:8px}
#boardInner.massive #skillPanel{flex-basis:108px}
#boardInner.massive #cardsArea{min-width:0}
#skillPanel{flex:0 0 118px;display:flex;flex-direction:column;gap:7px;padding:8px;border-radius:14px;background:linear-gradient(#f8fbff,#e9effa);border:1px solid #c8d2e9;box-shadow:inset 0 1px #fff,0 3px 10px #3c508c14}
#skillPanel[hidden]{display:none}
#skillChoiceHint{font-size:8px;text-align:center;color:#7884a1;font-weight:800;margin-top:-4px}
#skillChoices{display:flex;flex-direction:column;gap:6px}
.skillChoiceBtn{position:relative;border:1px solid #bcc8e3;border-radius:11px;background:#fff;color:#293655;min-height:54px;padding:6px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #c7d0e5;transition:.18s;text-align:left}
.skillChoiceBtn:hover{border-color:#8ea8ff;transform:translateY(-1px)}
.skillChoiceBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #c7d0e5}
.skillChoiceBtn strong{display:block;font-size:12px;line-height:1.1}
.skillChoiceBtn span{display:block;font-size:8px;color:#677493;margin-top:3px;line-height:1.2}
.skillChoiceBtn .skillIcon{position:absolute;right:6px;top:6px;font-size:14px}

.skillTitle{font-size:12px;font-weight:900;color:#59698d;text-align:center;letter-spacing:.04em}
#skillCooldown{font-size:9px;text-align:center;color:#5d6c8f;margin:-2px 0 2px;font-weight:800}
.skillBtn{position:relative;border:1px solid #bcc8e3;border-radius:11px;background:#fff;color:#293655;min-height:58px;padding:7px 6px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #c7d0e5;transition:.18s;text-align:left}
.skillBtn:hover{border-color:#8ea8ff;transform:translateY(-1px)}
.skillBtn:active{transform:translateY(1px);box-shadow:0 1px 0 #c7d0e5}
.skillBtn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.2);transform:none}
.skillBtn.armed{border-color:#8ea8ff;background:#eef3ff;box-shadow:0 0 14px #8ea8ff55,0 3px 0 #aab9ea}
.skillBtn strong{display:block;font-size:13px;line-height:1.1}
.skillBtn span{display:block;font-size:9px;color:#677493;margin-top:4px;line-height:1.25}
.skillCdBadge{position:absolute;right:4px;top:4px;font-size:8px;font-weight:900;color:#6e7ca0}
#cardsArea{flex:1;min-width:0}
.lbl{font-size:12px;opacity:.55;margin:6px 0 4px;position:relative}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;--cols:4}
.grid.swarm,.grid.massive{grid-template-columns:repeat(12,minmax(0,1fr));gap:6px}
.grid.massive .card,.grid.swarm .card{padding:13px 1px;font-size:15px;border-radius:9px}
.card{position:relative;background:#fff;color:#1d2440;border:2px solid #c9d3ee;border-radius:12px;padding:20px 2px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 #c9d3ee;transition:border-color .2s,background .3s,transform .12s}
.card:hover{border-color:#ffb020}
.card.selected{border-color:#8ea8ff;background:#eef3ff;box-shadow:0 0 14px #7f9cff66,0 3px 0 #aab9ea;animation:selectGlow 1.1s ease-in-out infinite}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d3ee}
.card.selected::before{content:"";position:absolute;inset:-2px;border-radius:12px;padding:2px;background:conic-gradient(from var(--a),transparent 0 55%,#8ea8ff 80%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang .9s linear infinite}
.card.wrong{animation:sh .3s;border-color:#ff5d6c}
@keyframes ang{to{--a:360deg}}
@keyframes glow{50%{box-shadow:0 0 20px #ffa500aa,inset 0 0 12px #ffc84a88}0%,100%{box-shadow:0 0 8px #ffa50066,inset 0 0 6px #ffc84a44}}
@keyframes selectGlow{50%{box-shadow:0 0 16px #7f9cff88,inset 0 0 10px #dce5ff}}
#skillToast{position:absolute;left:50%;bottom:5px;transform:translateX(-50%) translateY(8px);padding:6px 10px;border-radius:10px;background:#ffffffee;border:1px solid #bcc8e3;box-shadow:0 6px 16px #3c508c22;font-size:11px;font-weight:900;color:#445277;opacity:0;pointer-events:none;transition:.18s;z-index:12}#skillToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#monsterSkillText{font-size:9px;font-weight:900;color:#5b4b82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#critFlash{position:absolute;left:50%;top:122px;transform:translateX(-50%) scale(.6);padding:6px 10px;border-radius:999px;background:#fff1a8;border:2px solid #ffbf4e;color:#8d4a00;font-size:16px;font-weight:1000;opacity:0;pointer-events:none;z-index:9}
#critFlash.show{animation:critPop .7s ease-out}
@keyframes critPop{0%{opacity:0;transform:translateX(-50%) scale(.6) rotate(-6deg)}15%{opacity:1;transform:translateX(-50%) scale(1.06) rotate(4deg)}70%{opacity:1;transform:translateX(-50%) scale(1) rotate(0)}100%{opacity:0;transform:translateX(-50%) scale(.92) translateY(-18px)}}
@media(max-width:620px){.grid.swarm,.grid.massive{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}.grid.massive .card,.grid.swarm .card{padding:11px 1px;font-size:14px}}
@media(max-width:520px){#boardInner{flex-direction:column}.skillPanel{display:grid}}
#defeat{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(21,25,50,.52);backdrop-filter:blur(4px);z-index:20}
#defeat.show{display:flex}
#defeatBox{min-width:260px;padding:26px 28px;border-radius:20px;background:linear-gradient(#fff,#edf1fb);border:2px solid #c3cde8;box-shadow:0 18px 60px #0b123044;text-align:center}
#defeatTitle{font-size:34px;font-weight:900;margin-bottom:8px}
#defeatText{font-size:14px;opacity:.65;margin-bottom:18px}
#restart{border:0;border-radius:12px;padding:12px 22px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;background:#eef3ff;color:#24335f;box-shadow:0 4px 0 #aab9ea}
#restart:active{transform:translateY(2px);box-shadow:0 2px 0 #aab9ea}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#fx{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:5}
</style></head>
<body>
<div id="scene">
 <div id="hud">
  <div id="info"></div>
  <div id="speechMode" aria-label="몬스터 대사 모드">
   <span id="modeLabel">대사</span>
   <button class="modeBtn active tease" id="modeTease" type="button" aria-pressed="true">😈 조롱</button>
   <button class="modeBtn cheer" id="modeCheer" type="button" aria-pressed="false">✨ 응원</button>
  </div>
  <div id="hpbar"><div id="hp"></div></div>
 </div>
 <div id="arena">
  <div id="mob">
   <div id="monsterHpWrap"><div id="monsterHpBar"><div id="monsterHpFill"></div></div><div id="monsterHpText">HP 50 / 50</div><div id="monsterSkillText">👹 몬스터 스킬: 5턴 후</div></div>
   <div id="monsterAura"></div>
   <div id="mobBody"></div>
   <span class="horn left"></span><span class="horn right"></span>
   <div id="mobFace"><span class="eye left"></span><span class="eye right"></span><span class="mouth"></span></div>
   <div id="monsterSpeech" role="status" aria-live="polite"></div>
   <div id="critFlash">CRITICAL!</div>
  </div>
  <div id="tw"><div id="target"></div><div id="hint">뜻과 음을 모두 맞혀 빛을 모으세요</div></div>
  <div id="skillToast" role="status" aria-live="polite"></div>
 </div>
 <div id="board">
  <div id="boardInner">
   <aside id="skillPanel" aria-label="플레이어 스킬" hidden>
    <div class="skillTitle">⚡ 스킬 선택</div>
    <div id="skillChoiceHint">3개 중 하나를 골라!</div>
    <div id="skillChoices"></div>
   </aside>
   <section id="cardsArea">
    <div class="lbl">뜻</div><div class="grid" id="row1"></div>
    <div class="lbl">음</div><div class="grid" id="row2"></div>
   </section>
  </div>
 </div>
</div>
<div id="defeat" aria-hidden="true"><div id="defeatBox"><div id="defeatTitle">패배!</div><div id="defeatText">HP가 모두 소진됐어.</div><button id="restart" type="button">다시 시작</button></div></div>
<canvas id="fx"></canvas>
<script>
// =============================
// ✏️ 여기만 수정하면 한자를 바꿀 수 있어!
// [한자, 뜻, 음] 순서로 적어 주세요.
// 예: ["學","배울","학"]
// =============================
const HANJA=[["水","물","수"],["火","불","화"],["山","산","산"],["日","날","일"],["月","달","월"],["木","나무","목"],["金","쇠","금"],["土","흙","토"],["人","사람","인"],["大","큰","대"],["小","작을","소"],["中","가운데","중"]];
const W=HANJA;

// ===========================================
// 💬 여기만 수정하면 몬스터 대사를 바꿀 수 있어!
// 배열에 문장을 추가하면 랜덤으로 등장해.
// tease = 조롱 / cheer = 응원
// miss = 오답, hit = 공격당했을 때
// cancel = 선택 취소, victory = 몬스터를 쓰러뜨렸을 때
// lose = 플레이어 패배
// ===========================================
const DIALOGUES={
 tease:{
  miss:["ㅋㅋㅋ 그걸 고른다고?","한자 실력 에반데","뭐야 ㅋㅋㅋ 이렇게 못할 줄이야","이래가지고 나 이길 수 있겠냐?","너무 당당하네 ㅋㅋ","오답이란다 ㅋ","시험은 실전이야 ㅋ","이게 니 한자 실력? ㅋㅋ"],
  hit:["아잇 에바야 어케 맞췄냐고","한자 실력 진짜 에반데","으으… 한 방 맞았다!","이런! 또 맞았잖아!","저 꼬맹이가 어떻게 때린거지?;;","컨닝하는 거 아니지? 우리 친구","퍼돌이 지능보다 높냐; 좀 치는데?","아직 살아있다"],
  cancel:["어라? 마음이 바뀌었어?","흠… 겁먹은 건 아니지?","좋아, 더 고민해봐!","찍었다가 취소하기? ㅋㅋ","그냥 생각 없이 누르는 거 아니지? ㅋㅋ","어어? 하남자(또는 하여자) 컨트롤","취소만 하다가 1시간 다 가겠네 ㅋㅋㅋ","그거 알아? 취소 기능 없었으면 넌 이미 망했어 ㅋㅋ"],
  victory:["뭐야 어떻게 이겼어","다음에는 지능 높여서 온다","저 꼬맹이가 날 이길 줄이야..","상대가 바보인 줄 알았더니 내가 바보였던 건에 대하여."],
  lose:["ㅋㅋㅋ 결국 내가 이겼네!","이 정도면 한자 공부 좀 해야겠는데?","어때? 다음엔 나 못 이기겠지?","좋아, 오늘은 내가 선생님이다 ㅋㅋ"]
 },
 cheer:{
  miss:["괜찮아! 다시 골라보자!","아깝다! 조금만 더 생각해봐!","실수할 수도 있지!","다음엔 맞힐 수 있어!","좋아, 다시 한 번 가보자!"],
  hit:["와! 멋진 공격이야!","정확해! 제대로 맞았어!","대단한데? 계속 가자!","좋아! 한 방 제대로 들어갔어!"],
  cancel:["천천히 골라도 괜찮아!","좋아, 다시 생각해보자!","신중하게 골라봐!","마음에 드는 답을 찾아보자!"],
  victory:["해냈다! 우리가 이겼어!","정말 대단해! 몬스터를 쓰러뜨렸어!","멋진 승리야! 다음 레벨로 가자!","와! 끝까지 잘 해냈어!"],
  lose:["괜찮아! 다음 판에서 다시 도전하자!","아쉽다! 그래도 정말 잘했어!","괜찮아, 한 번 더 하면 돼!","다음에는 꼭 이길 수 있어!"]
 }
};

const COMBAT={
 normalDamage:5,
 critDamage:10,
 critChance:0.20,
 wrongDamage:5,
 enragedWrongDamage:10,
 monsterMaxHp:50,
 skillCooldown:5,
 monsterSkillCooldown:5,
 targetAppearances:2,

function muzzle(){const r=$("cardsArea").getBoundingClientRect();return{x:r.left+r.width/2,y:r.top-6}}
function perim(r){let p=Math.random()*2*(r.width+r.height),w=r.width,h=r.height;
 if(p<w)return{x:r.left+p,y:r.top};p-=w;if(p<h)return{x:r.right,y:r.top+p};p-=h;if(p<w)return{x:r.right-p,y:r.bottom};p-=w;return{x:r.left,y:r.bottom-p}

 cx.globalAlpha=1;cx.shadowBlur=0;cx.fillStyle=g;cx.beginPath();cx.arc(x,y,R*2.2,0,7);cx.fill();cx.fillStyle="#fff";cx.beginPath();cx.arc(x,y,R*.5,0,7);cx.fill()}

function initTargetStats(){
 targetStats=new Map(W.map(w=>[w,{count:0,last:-Infinity}]));
}
function chooseTarget(){
 if(!W.length)return null;
 const totalDone=[...targetStats.values()].reduce((a,s)=>a+s.count,0);
 if(totalDone>=W.length*COMBAT.targetAppearances){
  initTargetStats();
 }
 let eligible=W.filter(w=>{
  const s=targetStats.get(w);
  return s && s.count<COMBAT.targetAppearances && (targetRound-s.last)>COMBAT.targetGapRounds;
 });
 if(!eligible.length){
  eligible=W.filter(w=>targetStats.get(w)?.count<COMBAT.targetAppearances);
 }
 if(!eligible.length){
  initTargetStats();
  eligible=W.slice();
 }
 const picked=shuf(eligible)[0];
 const st=targetStats.get(picked);
 st.count++;
 st.last=targetRound;
 targetRound++;
 return picked;
}

function impact(M,targetId){
 if(gameOver || targetId!==monsterId || monsterHp<=0)return;
 const plan=attackPlan||{strikes:1,flashy:false,forceCrit:false,fixedDamage:null,current:0};
 const crit=plan.fixedDamage==null && (plan.forceCrit || Math.random()<COMBAT.critChance);
 const rawDamage=plan.fixedDamage!=null ? plan.fixedDamage : (crit?COMBAT.critDamage:COMBAT.normalDamage);
 const absorbed=monsterShield>0?Math.min(monsterShield,rawDamage):0;
 if(absorbed>0) monsterShield-=absorbed;
 const dmg=Math.max(0,rawDamage-absorbed);
 P.push({k:"r",x:M.x,y:M.y,t:0,d:.55,m:crit?90:70},{k:"r",x:M.x,y:M.y,t:-.1,d:.7,m:crit?130:100});
 const particleCount=crit?55:30;
 for(let i=0;i<particleCount;i++){
  const a=Math.random()*6.28,v=(crit?140:80)+Math.random()*(crit?260:200);
  P.push({k:"s",x:M.x,y:M.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,d:.5+Math.random()*.45,sz:1.5+Math.random()*2.6});
 }
 const m=$("mob"),sc=$("scene");
 m.classList.add("hit");sc.classList.add("shake");
 if(crit)flashCrit();
 setTimeout(()=>{m.classList.remove("hit");sc.classList.remove("shake")},250);
 monsterHp=Math.max(0,monsterHp-dmg);
 if(absorbed>0) showSkillToast(`🛡️ 방패가 ${absorbed} 피해를 막았다!`);
 if(plan.healOnHit){
  hp=Math.min(maxHp,hp+5);
  showSkillToast("🩸 HP 5 회복!");
 }
 score+=crit?15:10;
 info();
 setTimeout(()=>sayMonster(speechMode==="tease"?"bad":"good",(crit?"💥 ":"")+randomLine("hit")),180);

 plan.current++;
 plan.strikes--;

 if(monsterHp<=0){
  monsterKills++;
  score+=50;
  info();
  setTimeout(()=>sayMonster(speechMode==="tease"?"bad":"good",randomLine("victory")),550);
  m.classList.add("die");
  setTimeout(()=>{
   if(monsterKills>=3){ victory(); return; }
   level++;
   maxHp=50;hp=maxHp;
   prepareNewMonster();
   attackPlan=null;
   advanceTurn();
   round();
  },900);
  return;
 }

 if(plan.strikes>0){
  setTimeout(()=>startAttackSequence(),260);
 }else{
  attackPlan=null;
  consumeMonsterSkill();
  advanceTurn();
  setTimeout(()=>round(),450);
 }
}

  P.push({k:"ret",sx:B.x,sy:B.y,tx:s.x,ty:s.y,px:B.x,py:B.y,t:-Math.random()*.12,d:.45+Math.random()*.25,off:(Math.random()-.5)*120,sz:1.4+Math.random()*1.8});

 }

 showSkillToast(lines[type]||"⚡ 스킬 발동!");
 sayMonster("good",lines[type]||"스킬 발동!");
 renderSkillUI();info();
}

function enemyBoardTarget(){ return ctr($("board")); }
function resolveEnemyDamage(dmg){
  if(gameOver)return;
  const skill=monsterSkillActive;
  const blocked=guardActive;
  guardActive=false;
  const actual=blocked?0:dmg;
  hp=Math.max(0,hp-actual);
  score=Math.max(0,score-(actual>0?2:0));
  if(skill==="leech") monsterHp=Math.min(COMBAT.monsterMaxHp,monsterHp+5);
  const hud=$("hud"),board=$("board"),scene=$("scene");
  hud.classList.remove("damaged");void hud.offsetWidth;hud.classList.add("damaged");
  board.classList.remove("enemyHit");void board.offsetWidth;board.classList.add("enemyHit");
  scene.classList.add("shake");
  setTimeout(()=>{scene.classList.remove("shake");board.classList.remove("enemyHit")},350);
  if(blocked) sayMonster("good","🛡️ 철벽이 막아냈다!");
  if(skill==="leech") showSkillToast("🩸 몬스터 HP +5");
  info();
  sayMonster(speechMode==="tease"?"bad":"good",randomLine("miss"));
  if(hp<=0){defeat();return}
  const scramble=skill==="scramble";
  consumeMonsterSkill();
  advanceTurn();
  if(scramble){
   got={m:null,s:null};
   busy=false;
   currentRoundPool=shuf(currentRoundPool);
   rerenderCards();
   showSkillToast("🌀 카드판이 뒤섞였다! 같은 문제를 다시 풀어봐!");
   return;
  }
  setTimeout(()=>round(),280);
}

function enemyAttack(dmg){
  const A=ctr($("mob")),T=enemyBoardTarget();
  P.push({k:"enemy",sx:A.x,sy:A.y,tx:T.x,ty:T.y,px:A.x,py:A.y,t:0,d:.48,sz:11,dmg});
  const m=$("mob");
  m.classList.add("cast");
  setTimeout(()=>m.classList.remove("cast"),420);
}

function pick(b,ok,k){
 if(gameOver||busy)return;
 const selected=b.classList.contains("selected");
 if(selected){
  b.classList.remove("selected");
  got[k]=null;
  returnToCard(b);
  sayMonster(speechMode==="tease"?"bad":"good",randomLine("cancel"));
  return;
 }
 b.classList.add("selected");
 got[k]=ok;
 absorb(b);
 if(got.m!==null&&got.s!==null){
  busy=true;
  if(got.m&&got.s){
   const strikes=armedSkill==="double"?2:1;
   const flashy=armedSkill==="flash"||armedSkill==="smite";
   const forceCrit=armedSkill==="flash";
   const fixedDamage=armedSkill==="smite"?15:(armedSkill==="drain"?8:null);
   const healOnHit=armedSkill==="drain";
   attackPlan={strikes,flashy,forceCrit,fixedDamage,healOnHit,current:0};
   armedSkill=null;
   pending=true;
  }else{
   const wrongDamage=monsterSkillActive==="rage"?COMBAT.enragedWrongDamage:COMBAT.wrongDamage;
   enemyAttack(wrongDamage);
  }
 }
}

 $("defeat").classList.remove("show");$("defeat").setAttribute("aria-hidden","true");
 level=1;maxHp=50;hp=50;score=0;monsterHp=COMBAT.monsterMaxHp;monsterKills=0;turnCount=0;
 playerSkillCooldown=0;armedSkill=null;guardActive=false;availableSkillChoices=[];
 playerCardExpansion=false;monsterSkillCooldown=COMBAT.monsterSkillCooldown;monsterSkillActive=null;monsterShield=0;
 P.length=0;be=0;currentRoundPool=[];currentTarget=null;got={m:null,s:null};
 $("board").style.setProperty("--c",0);$("boardInner").classList.remove("massive");
 const m=$("mob");m.classList.remove("die","hit","enter","cast");m.style.opacity="";m.style.transform="";
 monsterId=0;
 initTargetStats();targetRound=0;
 shape();prepareNewMonster();info();round();
}

let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;cx.clearRect(0,0,innerWidth,innerHeight);
 const B=ctr($("cardsArea")),Z=muzzle(),M=ctr($("mob")),tm=n/1000;
 for(let i=P.length-1;i>=0;i--){
  const p=P[i];p.t+=dt;if(p.t<0)continue;const u=Math.min(1,p.t/p.d);
  if(p.k==="a"){
   const e=u*u*(3-2*u),mx=(p.sx+B.x)/2+p.off*.3,my=(p.sy+B.y)/2-p.off,q=1-e;
   const x=q*q*p.sx+2*q*e*mx+e*e*B.x,y=q*q*p.sy+2*q*e*my+e*e*B.y;
   cx.globalAlpha=.5;cx.strokeStyle="#ffa000";cx.lineWidth=p.sz;cx.shadowBlur=0;cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(x,y);cx.stroke();
   dot(x,y,p.sz*(1-.4*u),.95);p.px=x;p.py=y;
   if(u>=1){be+=1/56;$("board").style.setProperty("--c",Math.min(1,be).toFixed(2));P.splice(i,1)}
  }else if(p.k==="enemy"){
   const e=u*u*(3-2*u);
   const x=p.sx+(p.tx-p.sx)*e,y=p.sy+(p.ty-p.sy)*e;
   const tail=Math.max(1,Math.ceil(Math.hypot(x-p.px,y-p.py)/5));
   for(let j=1;j<=tail;j++){
    const f=j/tail;
    P.push({k:"tr",x:p.px+(x-p.px)*f,y:p.py+(y-p.py)*f,t:0,d:.24,sz:p.sz*.7});
   }
   p.px=x;p.py=y;orb(x,y,p.sz*(1-.45*e));
   if(u>=1){
    const tx=p.tx,ty=p.ty,dmg=p.dmg;
    P.splice(i,1);
    for(let q=0;q<18;q++){const a=Math.random()*Math.PI*2,v=70+Math.random()*130;P.push({k:"s",x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,d:.4+Math.random()*.25,sz:1.5+Math.random()*2.5});}
    resolveEnemyDamage(dmg);
   }
  }else if(p.k==="ret"){
   const e=u*u*(3-2*u),mx=(p.sx+p.tx)/2+p.off*.25,my=(p.sy+p.ty)/2-p.off*.5,q=1-e;
   const x=q*q*p.sx+2*q*e*mx+e*e*p.tx,y=q*q*p.sy+2*q*e*my+e*e*p.ty;
   cx.globalAlpha=.45;cx.strokeStyle="#8ea8ff";cx.lineWidth=p.sz;cx.shadowBlur=0;cx.beginPath();cx.moveTo(p.px,p.py);cx.lineTo(x,y);cx.stroke();
   dot(x,y,p.sz*(1-.35*u),.9);p.px=x;p.py=y;if(u>=1)P.splice(i,1)
  }else if(p.k==="tr"){
   dot(p.x,p.y,p.sz*(1-u),.85*(1-u));if(u>=1)P.splice(i,1)
  }else if(p.k==="s"){
   p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-3*dt;p.vy*=1-3*dt;dot(p.x,p.y,p.sz*(1-u*.7),1-u);if(u>=1)P.splice(i,1)
  }else if(p.k==="r"){
   cx.globalAlpha=1-u;cx.strokeStyle="#ff9d00";cx.lineWidth=4*(1-u);cx.shadowColor="#ffb020";cx.shadowBlur=12;
   cx.beginPath();cx.arc(p.x,p.y,8+u*p.m,0,7);cx.stroke();if(u>=1)P.splice(i,1)
  }
 }
 if(pending&&!P.some(p=>p.k==="a")){
  pending=false;
  $("board").classList.add("burst");setTimeout(()=>$("board").classList.remove("burst"),600);
  startAttackSequence();
 }
 if(proj){
  proj.t+=dt;
  if(proj.ph==="c"){
   const s=Math.min(1,proj.t/.5);
   orb(Z.x,Z.y,4+s*20);
   for(let i=0;i<3;i++){
    const a=tm*6+i*2.094;
    dot(Z.x+Math.cos(a)*(4+s*20)*2.4,Z.y+Math.sin(a)*(4+s*20)*1.3,2.4,.9);
   }
   if(s>=1){
    proj={ph:"f",t:0,x0:Z.x,y0:Z.y,lx:Z.x,ly:Z.y,targetId:proj.targetId};
    be=0;$("board").style.setProperty("--c",0);
   }
  }else{
   const u=Math.min(1,proj.t/.55),e=u*u;
   const x=proj.x0+(M.x-proj.x0)*e,y=proj.y0+(M.y-proj.y0)*e;
   const r=24*(1-.7*e);
   const dd=Math.hypot(x-proj.lx,y-proj.ly),st=Math.max(1,Math.ceil(dd/6));
   for(let j=1;j<=st;j++){
    const f=j/st;
    P.push({k:"tr",x:proj.lx+(x-proj.lx)*f,y:proj.ly+(y-proj.ly)*f,t:0,d:.42,sz:r*.7});
   }
   proj.lx=x;proj.ly=y;orb(x,y,r);
   if(u>=1){const targetId=proj.targetId;proj=null;impact(M,targetId);}
  }
 }
 cx.globalAlpha=1;requestAnimationFrame(loop);
}

$("restart").addEventListener("click",resetGame);
$("modeTease").addEventListener("click",()=>setSpeechMode("tease"));
$("modeCheer").addEventListener("click",()=>setSpeechMode("cheer"));


initTargetStats();
monsterId=1;
shape();info();round();spawn();requestAnimationFrame(loop);

</script>
</body></html>
